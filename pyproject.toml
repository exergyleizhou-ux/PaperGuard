[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperguard"
version = "2.4.1"
description = "Statistical anomaly screener for tabular research data"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "PaperGuard Contributors"}]
license = {text = "MIT"}
keywords = ["research", "integrity", "statistics", "scientific-misconduct", "forensics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "python-dateutil>=2.9",
    "diskcache>=5.6",
    "pyyaml>=6.0",
    "imagehash>=4.3",
    "pillow>=10.0",
    "opencv-python-headless>=4.8",
    "biopython>=1.83",
    "piexif>=1.1",
    "networkx>=3.0",
]

[project.optional-dependencies]
webui = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "bcrypt>=4.0",
    "itsdangerous>=2.2",
    # SQLAlchemy 2.x needs greenlet for its async->sync bridge. It's a
    # transitive dep on most platforms but is "optional" on macOS arm64
    # in some versions, so declare it explicitly.
    "greenlet>=3.0",
    # Rate-limit Redis backend (2.1.15). InMemoryBackend works without
    # it; install only when running multi-worker production.
    "redis>=4.0",
]
# 2.1.17 — legacy Word format support.
legacy-doc = [
    "olefile>=0.47",
]
# 2.2.0 — industrial extension pack (I1 / I2 / I5 + HDF5 ingest).
industrial = [
    "h5py>=3.10",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "hypothesis>=6.99",
    "ruff>=0.4",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "bcrypt>=4.0",
    "itsdangerous>=2.2",
    "greenlet>=3.0",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "scipy-stubs>=1.12",
    "types-pyyaml>=6.0",
    # Rate-limit testing
    "redis>=4.0",
    "fakeredis>=2.0",
]

[project.scripts]
paperguard = "paperguard.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
markers = [
    "network: tests requiring network access",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["scripts/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
