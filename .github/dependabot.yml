version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "hypothesis"
          - "types-*"
      core-dependencies:
        patterns:
          - "pydantic*"
          - "click"
          - "rich"
          - "httpx"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
